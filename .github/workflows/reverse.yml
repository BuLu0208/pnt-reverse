name: Reverse IPA - Decompile Encryption

on:
  push:
    paths:
      - 'DecompileSecurity.java'
      - '.github/workflows/reverse.yml'

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download IPA
        run: |
          curl -L -H "Accept: application/octet-stream" \
            -o app.ipa \
            "https://github.com/BuLu0208/pnt-reverse/releases/download/pnt/3.4.0.ipa"

      - name: Extract IPA
        run: |
          unzip -q app.ipa -d extracted
          find extracted -name "TouchTV" -type f -exec cp {} binary \;

      - name: Setup Ghidra
        run: |
          wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.0.3_build/ghidra_11.0.3_PUBLIC_20240410.zip
          unzip -q ghidra_11.0.3_PUBLIC_20240410.zip
          mv ghidra_11.0.3_PUBLIC ghidra

      - name: Analyze + Decompile
        run: |
          mkdir -p /tmp/ghidra_project output
          ./ghidra/support/analyzeHeadless \
            /tmp/ghidra_project TestProject \
            -import binary \
            -scriptPath ${{ github.workspace }} \
            -postScript DecompileSecurity.java \
            -max-cpu 4 \
            -deleteProject
          echo "=== Files ==="
          find output -name "*.c" | wc -l
          ls -lhS output/ | head -30
          echo "=== Sample ==="
          head -100 output/*ecurity*.c 2>/dev/null | head -80
          head -100 output/*ncrypt*.c 2>/dev/null | head -80

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: decompiled
          path: output/
